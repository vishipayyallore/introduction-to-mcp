name: Python quality

on:
  pull_request:
    paths:
      - ".github/workflows/python-quality.yml"
      - "pyproject.toml"
      - "src/**/*.py"
      - "tests/**/*.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-quality.yml"
      - "pyproject.toml"
      - "src/**/*.py"
      - "tests/**/*.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups --link-mode=copy

      - name: Ruff
        run: uvx ruff check src tests

      - name: Black
        run: uvx black --check src

      - name: isort
        run: uvx isort --check-only src

      - name: Flake8
        run: uvx flake8 src

      - name: Compileall
        run: uv run python -m compileall -q src

      - name: Pytest
        run: uv run pytest tests -q
