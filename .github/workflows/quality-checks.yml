name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups --link-mode=copy

      - name: Ruff
        run: uv run ruff check src

      - name: Compileall
        run: uv run python -m compileall -q src

      - name: Markdownlint
        run: npx --yes markdownlint-cli2 "README.md" "docs/**/*.md" ".github/**/*.md"

      - name: Docs links
        shell: pwsh
        run: ./tools/psscripts/docs-links.ps1
